<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Top bar -->
  <rect x="24" y="24" width="752" height="44" rx="8" fill="#1e293b" opacity="0.6"/>
  <circle cx="48" cy="46" r="6" fill="#ef4444"/>
  <circle cx="68" cy="46" r="6" fill="#eab308"/>
  <circle cx="88" cy="46" r="6" fill="#22c55e"/>
  <text x="115" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">cascade-eval-dashboard · NVIDIA Nemotron 3-Tier Escalation</text>

  <!-- Title & Badge -->
  <text x="48" y="125" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Cascade: Cost-Aware Nemotron Model Router</text>
  <rect x="48" y="145" width="130" height="26" rx="13" fill="#0369a1" opacity="0.4"/>
  <text x="62" y="162" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">NVIDIA Nemotron</text>
  <rect x="188" y="145" width="105" height="26" rx="13" fill="#4338ca" opacity="0.4"/>
  <text x="202" y="162" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="600">FastAPI + SSE</text>
  <rect x="303" y="145" width="95" height="26" rx="13" fill="#15803d" opacity="0.4"/>
  <text x="317" y="162" fill="#4ade80" font-family="monospace" font-size="12" font-weight="600">Streamlit UI</text>

  <!-- Flow Visual -->
  <g transform="translate(48, 195)">
    <!-- Step 1: Nano -->
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="18" y="32" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">1. Nemotron Nano</text>
    <text x="18" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Fast MoE Tier ($0.0002/req)</text>
    <text x="18" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Cheap heuristic &amp; tool lookup</text>

    <!-- Arrow 1 -->
    <path d="M 210 45 L 245 45" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="215" y="38" fill="#f43f5e" font-family="monospace" font-size="10">fail</text>

    <!-- Step 2: Super -->
    <rect x="255" y="0" width="200" height="90" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="273" y="32" fill="#818cf8" font-family="monospace" font-size="14" font-weight="700">2. Nemotron Super</text>
    <text x="273" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">120B Tier ($0.0009/req)</text>
    <text x="273" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Policy check &amp; reasoning</text>

    <!-- Arrow 2 -->
    <path d="M 465 45 L 500 45" stroke="#64748b" stroke-width="2"/>
    <text x="470" y="38" fill="#f43f5e" font-family="monospace" font-size="10">fail</text>

    <!-- Step 3: Ultra -->
    <rect x="510" y="0" width="194" height="90" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="528" y="32" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">3. Nemotron Ultra</text>
    <text x="528" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">550B Frontier Escalation</text>
    <text x="528" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Complex multi-issue resolution</text>
  </g>

  <!-- Metrics callout -->
  <rect x="48" y="315" width="704" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="342" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Dev Set (40 tickets): <tspan fill="#f1f5f9">90.0% accuracy at 65.7% lower cost than Super-only</tspan></text>
  <text x="70" y="364" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Held-Out Frozen Set (50 tickets): 42.0% accuracy vs 56.0% baseline at ~73% lower cost</text>

  <!-- Note banner -->
  <text x="400" y="415" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">📸 Replace with live Streamlit Evaluation Dashboard screenshot: assets/cascade-preview.png</text>
</svg>
