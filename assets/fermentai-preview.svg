  <circle cx="48" cy="46" r="6" fill="#ef4444"/>
  <circle cx="68" cy="46" r="6" fill="#eab308"/>
  <circle cx="88" cy="46" r="6" fill="#22c55e"/>
  <text x="115" y="52" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">FermentAI · Industrial Biotechnology Media Optimizer &amp; Yield Predictor</text>

  <!-- Title & Badges -->
  <text x="48" y="125" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">FermentAI: Yield Prediction &amp; Media Optimization</text>
  <rect x="48" y="145" width="105" height="26" rx="13" fill="#166534" opacity="0.5"/>
  <text x="62" y="162" fill="#4ade80" font-family="monospace" font-size="12" font-weight="600">Scikit-Learn</text>
  <rect x="163" y="145" width="85" height="26" rx="13" fill="#047857" opacity="0.5"/>
  <text x="177" y="162" fill="#34d399" font-family="monospace" font-size="12" font-weight="600">XGBoost</text>
  <rect x="258" y="145" width="155" height="26" rx="13" fill="#0369a1" opacity="0.5"/>
  <text x="272" y="162" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">Differential Evolution</text>
  <rect x="423" y="145" width="105" height="26" rx="13" fill="#ca8a04" opacity="0.5"/>
  <text x="437" y="162" fill="#fde047" font-family="monospace" font-size="12" font-weight="600">Streamlit UI</text>

  <!-- Comparison boxes -->
  <g transform="translate(48, 195)">
    <rect x="0" y="0" width="340" height="105" rx="10" fill="#052e16" stroke="#166534"/>
    <text x="20" y="32" fill="#4ade80" font-family="monospace" font-size="14" font-weight="700">Automated Multi-Model Regressor</text>
    <text x="20" y="56" fill="#86efac" font-family="-apple-system, sans-serif" font-size="12">Linear Regression vs. Random Forest vs. XGBoost</text>
    <text x="20" y="78" fill="#bbf7d0" font-family="-apple-system, sans-serif" font-size="12">Auto-selects optimal model using cross-validated R², MAE &amp; RMSE</text>

    <rect x="360" y="0" width="344" height="105" rx="10" fill="#052e16" stroke="#166534"/>
    <text x="380" y="32" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">SciPy Media Optimizer</text>
    <text x="380" y="56" fill="#86efac" font-family="-apple-system, sans-serif" font-size="12">Differential Evolution + Randomized Search</text>
    <text x="380" y="78" fill="#bbf7d0" font-family="-apple-system, sans-serif" font-size="12">Solves for optimal Temperature, pH, Agitation, &amp; Substrates</text>
