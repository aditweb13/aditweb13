  <rect x="48" y="325" width="704" height="50" rx="8" fill="#052e16" stroke="#14532d"/>
  <text x="70" y="356" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">🧪 Interactive Streamlit Lab: <tspan fill="#f0fdf4">Bioluminescent sci-fi theme with real-time yield prediction</tspan></text>

  <text x="400" y="415" text-anchor="middle" fill="#4ade80" font-family="-apple-system, sans-serif" font-size="12">📸 Replace with live Streamlit UI screenshot: assets/fermentai-preview.png</text>
