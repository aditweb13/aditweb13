name: Update Recent GitHub Activity

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update recent activity section in README
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Recent GitHub Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore: update recent GitHub activity [skip ci]"
          MAX_LINES: 5
